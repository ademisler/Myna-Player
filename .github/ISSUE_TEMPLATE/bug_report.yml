name: Bug report
description: Report a reproducible Myna Player problem
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, private media, personal transcripts, or unredacted diagnostic data. Security vulnerabilities must be reported privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.x or commit hash
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows 11
        - Windows 10
        - Other / unsupported
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the visible error and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: Runtime and model status
      description: Paste sanitized status from Advanced & diagnostics. Remove paths or private text when needed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials and private media/transcript content.
          required: true
        - label: This is not a security vulnerability.
          required: true
