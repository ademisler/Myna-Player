[package]
name = "myna-player"
version = "0.1.0"
description = "Myna Player desktop application"
authors = ["Adem Isler"]
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://myna-player.github.io/"
repository = "https://github.com/ademisler/Myna-Player"
publish = false

[lib]
name = "myna_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "io-util"] }
uuid = { version = "1", features = ["v4"] }
myna-player-core = { path = "../crates/myna-player-core", version = "0.1.0" }
myna-player-jobs = { path = "../crates/myna-player-jobs", version = "0.1.0" }
myna-player-media = { path = "../crates/myna-player-media", version = "0.1.0" }
myna-player-pipeline = { path = "../crates/myna-player-pipeline", version = "0.1.0" }
myna-player-player = { path = "../crates/myna-player-player", version = "0.1.0" }
myna-player-providers = { path = "../crates/myna-player-providers", version = "0.1.0" }
myna-player-storage = { path = "../crates/myna-player-storage", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
