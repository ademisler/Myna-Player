[package]
name = "subahead"
version = "0.1.0"
description = "SubAhead desktop application"
authors = ["Adem Isler"]
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "subahead_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subahead-core = { path = "../crates/subahead-core" }
subahead-media = { path = "../crates/subahead-media" }
subahead-pipeline = { path = "../crates/subahead-pipeline" }
