[package]
name = "subahead-ui"
version = "0.1.0"
edition = "2024"
description = "Local-first AI subtitle player frontend"
license = "GPL-3.0-or-later"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["HtmlVideoElement"] }
subahead-core = { path = "crates/subahead-core" }

[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/subahead-core",
  "crates/subahead-media",
  "crates/subahead-pipeline",
]
