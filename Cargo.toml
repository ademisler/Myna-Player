[package]
name = "myna-player-ui"
version = "0.1.0"
edition = "2024"
description = "Local-first AI subtitle player frontend"
license = "GPL-3.0-or-later"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["console", "DomRect", "Element", "HtmlElement", "KeyboardEvent"] }
myna-player-core = { path = "crates/myna-player-core", version = "0.1.0" }

[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/myna-player-core",
  "crates/myna-player-jobs",
  "crates/myna-player-media",
  "crates/myna-player-pipeline",
  "crates/myna-player-player",
  "crates/myna-player-providers",
  "crates/myna-player-storage",
]
